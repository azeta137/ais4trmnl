name: Update AIS snapshot

on:
  schedule:
    - cron: "*/20 * * * *"   # ogni 20 minuti
  workflow_dispatch: {}       # permette anche l'esecuzione manuale dalla UI

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install websockets

      - name: Fetch AIS snapshot
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python fetch_ais.py

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/vessels.json
          git diff --staged --quiet || git commit -m "Update AIS snapshot"
          git push
